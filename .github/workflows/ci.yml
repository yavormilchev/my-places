name: "CI"
permissions:
  contents: read

on:
  push:
    branches:
      - "master"
  pull_request:

jobs:
  check:
    runs-on: "ubuntu-latest"
    env:
      DATABASE_URL: "postgres://ci_user:ci_pass@localhost:5432/my_places"
      TEST_DATABASE_URL: "postgres://ci_user:ci_pass@localhost:5432/my_places"
      GOOGLE_PLACES_SERVER_SIDE_API_KEY: "INVALID"
      GOOGLE_OAUTH_CLIENT_ID: "INVALID"
      GOOGLE_OAUTH_CLIENT_SECRET: "INVALID"
      GOOGLE_OAUTH_REDIRECT_URI: "http://localhost:3000/auth/google/callback"
      WEB_APP_URL: "http://localhost:5173"
      ALLOWED_EMAIL: "INVALID"
      SESSION_SECRET: "test-secret"
    services:
      postgres:
        image: "imresamu/postgis:17-3.6"
        env:
          POSTGRES_USER: "ci_user"
          POSTGRES_PASSWORD: "ci_pass"
          POSTGRES_DB: "my_places"
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci_user -d my_places"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Set up Node"
        uses: "actions/setup-node@v4"
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: "Install dependencies"
        run: "npm ci"

      - name: "Format check"
        run: "npm run format:check"

      - name: "Lint check"
        run: "npm run lint"

      - name: "TS check"
        run: "npm run typecheck"

      - name: "Run migrations"
        run: "npm run migrate -w @my-places/api -- up"

      - name: "Tests"
        run: "npm run test"
